---
# File: inventories/dev/inventory.yml
# Description:
#   - Defines the development environment inventory for Raspberry Pi 5 cluster.
#   - Specifies host groups, IP addresses, and role-specific variable overrides.
#   - Configures shared variables used across multiple roles.
# Author: Andrii Sadovskyi <andrii.sadovskyi@gmail.com>

all:
  vars:
    ansible_user: admin # User for SSH connection. Consider using ansible-vault for sensitive credentials.
    ansible_python_interpreter: /usr/bin/python3
    preflight_expected_ips:
      - 192.168.50.201
      - 192.168.50.202
      - 192.168.50.203
      - 192.168.50.204

    # Shared by llama_cluster and hermes_agent.
    llama_head_bind_port: 8080
    llama_model_path: /opt/llama-cluster/models/gemma-3-1b-it-Q4_K_M.gguf
    llama_ctx_size: 65536

    # Shared by preflight, motd, and wifi.
    wifi_state: enabled

    # Shared by motd and ntp.
    ntp_enabled: true

  children:
    llama_cluster_nodes:
      vars:
        wifi_state: disabled
      children:
        llama_server_head:
          vars:
            llama_cluster_role: head
            open_webui_enabled: true
            llama_worker_endpoints:
              - 192.168.50.202:50052
              - 192.168.50.203:50052
          hosts:
            rpi5-dev-node-1:
              ansible_host: 192.168.50.201

        llama_rpc_workers:
          vars:
            llama_cluster_role: worker
          hosts:
            rpi5-dev-node-2:
              ansible_host: 192.168.50.202
            rpi5-dev-node-3:
              ansible_host: 192.168.50.203

    hermes_nodes:
      children:
        hermes_agent_nodes:
          hosts:
            rpi5-hermes-agent:
              ansible_host: 192.168.50.205