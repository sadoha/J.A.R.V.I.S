# Description:
#   - Sets repo-local Ansible defaults.
#   - Uses the YAML inventory and local roles path.
# Author: Andrii Sadovskyi <andrii.sadovskyi@gmail.com>
[defaults]
inventory = ./inventories/dev/inventory.yml
roles_path = ./roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = yaml
forks = 10
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False
