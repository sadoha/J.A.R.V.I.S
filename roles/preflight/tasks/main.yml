---
# File: roles/preflight/tasks/main.yml
# Description:
#   - Validates inventory structure, host counts, and IP mappings.
#   - Asserts Wi-Fi state input and target host architecture.
#   - Ensures key safety assumptions are met before deployment.
# Author: Andrii Sadovskyi <andrii.sadovskyi@gmail.com>

- name: Validate expected inventory group sizes
  # Docs: https://docs.ansible.com/ansible/latest/collections/ansible/builtin/assert_module.html
  ansible.builtin.assert:
    that:
      - "groups['llama_cluster_nodes'] | default([]) | length > 0"
      - "groups['llama_server_head'] | default([]) | length == 1"
      - "groups['llama_rpc_workers'] | default([]) | length > 0"
    fail_msg: >-
      Inventory must define at least one llama_cluster_nodes host, exactly one
      llama_server_head host, and at least one llama_rpc_workers host.
  run_once: true
  delegate_to: localhost
  become: false # Assertions do not require elevated privileges
  tags: [preflight, security]

