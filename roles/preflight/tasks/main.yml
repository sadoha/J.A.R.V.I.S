- name: Validate Wi-Fi state input
  # Docs: https://docs.ansible.com/ansible/latest/collections/ansible/builtin/assert_module.html
  ansible.builtin.assert:
    that:
      - wifi_state in ['enabled', 'disabled']
    fail_msg: wifi_state must be either enabled or disabled.
  become: false # Assertions do not require elevated privileges
  tags: [preflight, security]

- name: Ensure deployment targets are Linux on ARM64
  # Docs: https://docs.ansible.com/ansible/latest/collections/ansible/builtin/assert_module.html
  ansible.builtin.assert:
    that:
      - ansible_system == 'Linux'
      - ansible_architecture in ['aarch64', 'arm64']
    fail_msg: This playbook is intended for Raspberry Pi 5 running a 64-bit Linux OS.
  become: false # Assertions do not require elevated privileges
  tags: [preflight, security]
