---
# Description:
#   - Defines default values for the Hermes agent role.
#   - Keeps installation, service, and endpoint settings centralized.
# Author: Andrii Sadovskyi <andrii.sadovskyi@gmail.com>

hermes_agent_enabled: true
hermes_agent_repo_url: "https://github.com/NousResearch/hermes-agent.git"
hermes_agent_version: "main"
hermes_agent_install_dir: "/opt/hermes-agent"
hermes_agent_home_dir: "/opt/hermes-agent/.hermes"
hermes_agent_service_name: "hermes-agent"
hermes_agent_bind_host: "127.0.0.1"
hermes_agent_bind_port: "8000"
hermes_agent_api_url: >-
  http://{{ hostvars[groups['llama_server_head'][0]].ansible_host }}:{{ llama_head_bind_port }}/v1
hermes_agent_model_id: "{{ llama_model_path | basename | regex_replace('\\.gguf$', '') }}"
hermes_agent_context_length: "{{ llama_ctx_size }}"
hermes_agent_model_api_key: none
hermes_agent_model_provider: custom
hermes_agent_hard_stop_enabled: true
hermes_agent_telegram_bot_token: "{{ vault_hermes_agent_telegram_bot_token }}"
hermes_agent_telegram_allowed_users: "{{ vault_hermes_agent_telegram_allowed_users }}"
